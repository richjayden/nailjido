"IR":{tagline:"원리를 탐구하고 손으로 검증하는 사람",intro:"당신은 머릿속에서 이해한 것을 직접 손으로 확인하고 싶어하는 사람이에요. 이론을 공부하는 것도 좋지만, 실제로 해봤을 때 비로소 진짜 이해가 되는 경험이 익숙할 거예요. 실험실과 현장을 오가며 지식을 쌓는 방식이 당신에게 가장 잘 맞아요. 연구하는 손, 만드는 두뇌를 동시에 가진 사람이에요.",nature:"지적 탐구심에 실용적 실행력이 더해져요. 원리를 이해하고 그것을 실제로 구현해내는 과정에서 가장 큰 성취감을 느껴요.",closing:"당신의 지식은 책 속에만 있지 않아요. 손으로 만들어지고 현장에서 검증되죠. 그 결합이 당신을 특별하게 만들어요."},
"IA":{tagline:"지식과 창의로 새로운 세계를 여는 사람",intro:"당신은 깊이 탐구하는 것을 좋아하면서, 그 결과를 남다른 방식으로 표현하는 사람이에요. 복잡한 개념을 아름다운 형태로 전달하거나, 아무도 생각하지 못한 창의적 방식으로 문제를 풀어요. 지식인의 깊이와 예술가의 감각이 함께 있는 희귀한 조합이에요. 아마 어떤 분야를 공부하든 남들과는 다른 시각으로 바라보는 편일 거예요.",nature:"분석적 사고와 창의적 표현이 시너지를 내요. 복잡한 것을 새로운 방식으로 풀어내는 능력이 탁월해요.",closing:"당신이 만들어내는 것들은 깊이가 있으면서도 아름다워요. 지식과 감각이 함께하는 사람이 가장 오래 기억되는 것들을 남겨왔어요."},
"IS":{tagline:"연구로 사람의 삶을 바꾸는 사람",intro:"당신은 지식을 쌓는 목적이 결국 사람을 돕기 위해서예요. 왜 그런지 끊임없이 탐구하는 것도, 데이터를 분석하는 것도 결국 누군가의 삶이 더 나아지길 바라는 마음에서 출발해요. 차갑게 보이는 연구 뒤에 따뜻한 마음이 있는 사람이에요. 이 조합은 의학·심리학·교육 분야에서 특히 강한 힘을 발휘해요.",nature:"탐구심과 공감 능력이 함께 있어요. 사람을 이해하려는 과학적 접근과 실제로 도우려는 따뜻한 마음이 균형을 이루죠.",closing:"당신의 연구와 탐구가 결국 누군가의 삶을 바꾸는 힘이 될 거예요. 지식이 따뜻함과 만날 때 가장 강력해지니까요."},
"IE":{tagline:"데이터로 전략을 세우고 행동하는 사람",intro:"당신은 충분히 분석하고 난 다음에 강하게 실행하는 사람이에요. 근거 없이 달려가는 게 아니라, 데이터와 논리로 방향을 먼저 확인하고 그다음에 추진력을 발휘하죠. '왜?'에 대한 답을 찾은 다음에야 '어떻게'로 달려가는 방식이 당신의 스타일이에요. 전략가이면서 실행가인 조합이에요.",nature:"분석력과 추진력이 순서 있게 작동해요. 논리적 근거 위에서 과감하게 행동하기 때문에 당신의 결정은 설득력이 강해요.",closing:"데이터를 믿고 과감하게 행동하는 것, 그 두 가지를 동시에 할 수 있는 사람이 세상을 가장 효율적으로 바꿔왔어요."},
"IC":{tagline:"정밀하게 분석하고 체계적으로 정리하는 사람",intro:"당신은 탐구한 결과를 절대 대충 정리하지 않는 사람이에요. 깊이 파고드는 것만큼 그 내용을 빈틈없이 체계화하는 데서 보람을 느껴요. 연구와 분류, 분석과 정리가 동시에 가능한 사람이에요. 복잡한 데이터도 당신을 거치면 명확하고 신뢰할 수 있는 자료가 되죠.",nature:"탐구심과 꼼꼼함이 시너지를 내요. 발견하고 정리하고 검증하는 전 과정을 완벽하게 해내는 능력이 있어요.",closing:"당신이 정리한 지식은 다른 사람들이 오래 의지하게 될 거예요. 탐구의 깊이와 정리의 정확함이 만날 때 진짜 가치 있는 결과물이 나와요."},
"AR":{tagline:"감각과 손기술로 창조하는 사람",intro:"당신은 머릿속에 있는 것을 직접 손으로 꺼내는 사람이에요. 상상하는 것으로 끝나지 않고, 실제로 만들어내야 직성이 풀리죠. 아이디어와 실행이 분리되지 않고 하나로 흐르는 창작 방식이 당신의 스타일이에요. 예술가의 감성과 제작자의 손이 함께 있는 사람이에요.",nature:"창의적 표현과 실제 제작 능력이 동시에 있어요. 구상에서 완성까지 혼자 해낼 수 있는 강력한 자기완결형 창작자예요.",closing:"당신의 작품은 머릿속에서 손끝으로 직접 이어져요. 그 힘이 다른 사람들이 상상만 하는 것을 실제로 존재하게 만들어요."},
"AI":{tagline:"감성과 지성이 만나는 사람",intro:"당신은 깊이 느끼면서 동시에 깊이 생각하는 사람이에요. 감각적인 것에 끌리지만 '왜 이게 아름다운가?'를 분석하고 싶어하죠. 창의적인 동시에 논리적이고, 표현하고 싶으면서 동시에 이해하고 싶은 두 가지 욕구가 공존해요. 아마 어떤 분야를 하든 남들보다 더 깊게, 더 독창적으로 접근하는 편일 거예요.",nature:"창의적 직관과 분석적 사고가 함께 작동해요. 감각으로 포착하고 논리로 정교하게 만드는 과정이 당신만의 방식이에요.",closing:"느끼는 것과 이해하는 것이 당신 안에서 하나로 연결돼요. 그 드문 조합이 가장 깊이 있는 창작물을 만들어내요."},
"AS":{tagline:"표현으로 사람의 마음을 치유하는 사람",intro:"당신은 창의적 표현이 결국 사람을 향해 있는 사람이에요. 아름다운 것을 만드는 목적이 누군가의 마음에 닿기 위해서죠. 공감 능력이 뛰어나고, 그 감정을 예술적으로 표현하는 능력이 있어요. 상담사의 따뜻함과 예술가의 감성이 함께 있는 조합이에요. 감동을 주는 것과 사람을 돕는 것이 당신에게는 같은 일이에요.",nature:"공감 능력과 창의적 표현이 시너지를 내요. 사람의 감정을 읽고 그것을 아름다운 방식으로 돌려주는 능력이 탁월해요.",closing:"당신이 만드는 것들은 누군가에게 위로이고 힘이에요. 예술과 따뜻함이 만날 때 가장 깊이 사람의 마음을 움직이니까요."},
"AE":{tagline:"창의적 아이디어로 사람들을 이끄는 사람",intro:"당신은 남다른 아이디어로 방향을 제시하고, 사람들이 그 비전을 따르게 만드는 사람이에요. 창의성이 혼자만의 것이 아니라 다른 사람들을 이끄는 힘이 되는 타입이에요. 새로운 것에 끌리고, 그것을 현실로 만들기 위해 사람들을 설득하고 움직이는 것이 자연스러워요. 크리에이터이면서 리더인 조합이에요.",nature:"창의적 발상과 실행 추진력이 함께해요. 아이디어를 내는 것과 그것을 현실로 만드는 것, 둘 다 잘할 수 있어요.",closing:"당신의 창의성은 혼자서 소비되지 않아요. 사람들을 이끌고 세상을 바꾸는 에너지가 돼요."},
"AC":{tagline:"섬세한 감각과 완벽한 마감의 균형",intro:"당신은 창의적인 아이디어를 가지면서 동시에 그 결과물이 완벽하게 마무리되어야 마음이 놓이는 사람이에요. 대충 넘어가는 것이 불편하고, 디테일이 잘못되면 전체가 만족스럽지 않죠. 예술가의 감각과 완벽주의자의 꼼꼼함이 함께 있어요. 오래 두고 봐도 질리지 않는 완성도 높은 것들을 만들어내는 유형이에요.",nature:"창의성과 정밀함이 동시에 있어요. 아름다운 것을 구상하고, 빈틈없이 완성해내는 전 과정을 혼자 해낼 수 있어요.",closing:"당신이 만든 것은 아름다우면서도 완벽해요. 감각과 꼼꼼함이 만날 때 시간이 지나도 빛을 잃지 않는 결과물이 나와요."},
"SR":{tagline:"실질적인 방법으로 따뜻하게 돕는 사람",intro:"당신은 사람을 도울 때 말보다 행동이 앞서는 사람이에요. 공감하고 위로하는 것도 중요하지만, 실제로 뭔가를 해줄 때 진짜 보람을 느껴요. '어떻게 하면 실질적으로 도움이 될까?'를 먼저 생각하고, 그 답을 손으로 실행하죠. 따뜻한 마음과 실용적인 행동력이 함께 있어요.",nature:"공감 능력과 실행력이 함께 있어요. 말이 아닌 결과로 사람에게 기여하는 것에서 가장 큰 보람을 느껴요.",closing:"당신의 도움은 눈에 보이고 손에 잡혀요. 그 실용적인 따뜻함이 누군가에게는 가장 기억에 남는 도움이 될 거예요."},
"SI":{tagline:"사람을 과학적으로 이해하고 돕는 사람",intro:"당신은 사람에게 관심이 많고, 그 관심이 단순한 공감에서 그치지 않아요. '왜 이 사람은 이런 행동을 할까?', '이 문제의 근본 원인은 뭘까?'를 탐구하는 방식으로 접근해요. 심리학, 뇌과학, 사회과학 같은 분야에서 특히 빛나는 조합이에요. 따뜻하면서도 분석적인 드문 유형이에요.",nature:"공감 능력과 탐구심이 시너지를 내요. 사람을 느끼는 것에 그치지 않고 이해하고 연구하는 단계까지 나아가요.",closing:"당신은 사람을 마음으로 느끼고, 머리로 이해해요. 그 두 가지가 함께할 때 가장 깊이 있는 도움을 줄 수 있어요."},
"SA":{tagline:"공감과 창의로 사람의 마음을 여는 사람",intro:"당신은 사람을 돕는 방식이 감각적이고 창의적이에요. 따뜻한 마음을 표현하는 데 일반적인 방식 대신 자기만의 방법을 쓰죠. 글이나 그림, 음악 같은 창의적 수단으로 사람과 연결되고 위로를 전해요. 상담사의 공감력과 예술가의 감성이 함께 있는 독특한 조합이에요.",nature:"따뜻함과 창의적 표현이 함께 있어요. 사람의 감정을 읽고, 그에 맞는 창의적인 방식으로 위로하고 연결하는 능력이 있어요.",closing:"당신이 건네는 위로는 평범하지 않아요. 감각적이고 따뜻한 그 방식이 사람들의 마음에 더 오래 남아요."},
"SE":{tagline:"사람들을 이끌며 세상을 변화시키는 사람",intro:"당신은 사람을 좋아하고, 그 사람들이 더 나아지는 걸 돕고 싶어요. 그리고 그것을 더 크게, 더 많은 사람에게 하고 싶은 마음도 있어요. 한 사람을 돕는 것을 넘어서 시스템을 바꾸고, 더 많은 사람에게 닿고 싶은 욕구가 있죠. 따뜻한 마음과 강한 추진력이 함께 있는 사회 변화형 리더예요.",nature:"공감 능력과 리더십이 함께해요. 사람들의 마음을 움직이고 그 에너지를 방향으로 이끄는 자연스러운 리더십이 있어요.",closing:"당신의 따뜻함이 더 많은 사람에게 닿을수록 세상이 더 좋아져요. 공감하는 리더가 가장 오래가는 변화를 만들어요."},
"SC":{tagline:"체계적으로 사람의 삶을 지원하는 사람",intro:"당신은 사람을 돕는 데 있어서 체계와 정확함을 중요하게 생각하는 사람이에요. 따뜻한 마음으로 다가가지만, 실제 지원이 빈틈없이 이뤄져야 진짜 도움이 된다고 생각해요. 감정도 중요하고 시스템도 중요한, 균형 잡힌 돌봄형 인재예요. 의료, 복지, 행정 지원 분야에서 특히 빛을 발하는 유형이에요.",nature:"공감 능력과 체계적 사고가 균형을 이뤄요. 사람을 진심으로 돕고 싶으면서 그 도움이 정확하고 신뢰할 수 있어야 한다는 기준이 있어요.",closing:"당신의 지원은 따뜻하면서도 정확해요. 그 두 가지가 함께할 때 사람들이 가장 오래, 가장 깊이 의지하게 되는 존재가 돼요."},
"ER":{tagline:"직접 뛰면서 팀을 이끄는 현장 리더",intro:"당신은 말로만 지시하는 리더가 아니에요. 가장 먼저 현장에 나가서 직접 해보이는 방식으로 신뢰를 얻어요. 추진력과 실행력이 동시에 있어서 계획을 세우고 직접 실행하는 전 과정을 혼자 이끌 수 있어요. '할 수 있어'라고 말하는 대신 직접 보여주는 사람이에요.",nature:"리더십과 실행력이 함께해요. 팀을 이끌면서 동시에 가장 많이 실행하는 사람으로, 신뢰와 성과를 동시에 만들어내요.",closing:"당신이 앞장서는 것만으로도 팀이 움직여요. 행동으로 증명하는 리더십이 가장 오래가는 신뢰를 만들어요."},
"EI":{tagline:"데이터 기반으로 전략을 세우는 리더",intro:"당신은 충분히 분석하고 난 다음에 강하게 실행하는 사람이에요. 근거 없이 달려가는 게 아니라, 데이터와 논리로 방향을 먼저 확인하고 그다음에 추진력을 발휘하죠. 설득력 있는 근거를 가지고 사람들을 이끄는 방식이 당신의 스타일이에요. 전략가이면서 실행가인 조합이에요.",nature:"분석력과 추진력이 순서 있게 작동해요. 논리적 근거 위에서 과감하게 행동하기 때문에 당신의 결정은 설득력이 강해요.",closing:"근거를 가지고 달려가는 것이 당신의 방식이에요. 분석하고 행동하는 사람이 가장 효율적으로 세상을 바꿔왔어요."},
"EA":{tagline:"창의적 비전으로 사람들을 이끄는 리더",intro:"당신은 새로운 아이디어로 방향을 제시하고 사람들을 그 비전으로 이끄는 사람이에요. 창의성이 혼자만의 것이 아니라 다른 사람들을 움직이는 에너지가 되죠. 남들이 생각하지 못한 방향을 먼저 보고, 그것을 향해 팀을 이끄는 것이 자연스러워요. 크리에이티브 디렉터형 리더예요.",nature:"창의적 발상과 리더십이 함께해요. 아이디어를 내고 그것을 실현하기 위해 사람들을 설득하고 이끄는 전 과정을 잘해요.",closing:"당신의 창의성은 세상에 혼자 존재하지 않아요. 사람들을 이끌고 함께 실현해나가는 에너지로 세상을 바꿔요."},
"ES":{tagline:"사람들을 이끌며 세상을 변화시키는 리더",intro:"당신은 사람에 대한 진심 어린 관심과 그 사람들을 더 나은 곳으로 이끌고 싶은 강한 추진력이 함께 있어요. 사회, 교육, 정책 분야에서 특히 빛나는 조합이에요. 사람들의 마음을 얻는 공감 능력과, 그 에너지를 방향으로 바꾸는 리더십이 동시에 있어요. 공감하는 리더, 변화를 만드는 사람이에요.",nature:"공감 능력과 리더십이 시너지를 내요. 사람들의 마음을 움직이고, 그 에너지를 실제 변화로 연결하는 능력이 탁월해요.",closing:"사람을 진심으로 대하면서 이끄는 사람이 가장 오래가는 변화를 만들어요. 당신이 바로 그런 리더예요."},
"EC":{tagline:"꼼꼼한 계획으로 큰 목표를 달성하는 리더",intro:"당신은 큰 그림을 그리는 추진력과, 그것을 빈틈없이 실행하는 꼼꼼함이 동시에 있어요. 목표를 향해 달려가면서도 디테일을 놓치지 않는 사람이에요. 계획하고 실행하고 점검하는 전 과정을 체계적으로 이끌 수 있어요. 비전과 실행력에 완성도까지 갖춘 드문 유형이에요.",nature:"추진력과 꼼꼼함이 균형을 이뤄요. 목표를 향해 강하게 달려가면서도 세부 사항을 놓치지 않는 능력이 있어요.",closing:"당신이 세운 계획은 실행되고 완성돼요. 큰 그림과 디테일을 동시에 보는 사람이 가장 믿음직한 리더가 돼요."},
"CR":{tagline:"정밀하게 만들고 체계적으로 관리하는 사람",intro:"당신은 만드는 것과 관리하는 것이 동시에 가능한 사람이에요. 뭔가를 직접 다루는 것을 좋아하면서, 그 과정이 체계적이고 정확하게 이뤄져야 마음이 놓이죠. 현장에서 직접 일하면서도 정밀한 기록과 관리를 놓치지 않는 사람이에요. 기술 분야의 완벽주의자 유형이에요.",nature:"실용적 기술력과 꼼꼼한 체계 관리가 함께해요. 만드는 것과 정리하는 것, 둘 다 잘하는 자기완결형 전문가예요.",closing:"당신이 관리하는 것은 믿음직해요. 정밀하게 만들고 꼼꼼하게 유지하는 그 능력이 어디서든 없어서는 안 될 존재를 만들어요."},
"CI":{tagline:"데이터를 정확하게 분석하고 체계화하는 사람",intro:"당신은 복잡한 정보를 탐구하고, 그 결과를 빈틈없이 정리하는 것에서 보람을 찾는 사람이에요. 분석하는 것도 좋고, 그 분석 결과를 체계적으로 정리하는 것도 좋아요. 데이터를 다루는 분야에서 특히 강한 힘을 발휘하는 조합이에요. 탐구하고 검증하고 정리하는 전 과정이 자연스러운 사람이에요.",nature:"탐구심과 체계적 사고가 함께해요. 복잡한 데이터도 당신을 거치면 명확하고 신뢰할 수 있는 자료가 돼요.",closing:"당신이 분석하고 정리한 것들은 다른 사람들이 오래 의지하게 될 거예요. 탐구와 정확함이 만날 때 진짜 가치 있는 결과가 나와요."},
"CA":{tagline:"섬세한 감각과 완벽한 정확함의 균형",intro:"당신은 아름다운 것에 끌리면서 동시에 그것이 완벽하게 정확해야 만족하는 사람이에요. 창의적인 감각과 꼼꼼한 완성도를 동시에 추구하죠. 예술적 감성이 있으면서도 디테일에 예민한 사람이에요. 오래 두고 봐도 빈틈이 없는 완성도 높은 창작물을 만들어내는 유형이에요.",nature:"창의적 감각과 꼼꼼한 정확함이 균형을 이뤄요. 아름답고 정확한, 두 가지 기준을 동시에 충족하는 결과물을 만들어내요.",closing:"당신이 만든 것은 아름다우면서 빈틈이 없어요. 감각과 꼼꼼함이 만날 때 시간이 지나도 퇴색하지 않는 가치가 생겨요."},
"CS":{tagline:"체계적으로 사람을 지원하는 전문가",intro:"당신은 사람을 돕고 싶은 마음이 있으면서, 그 도움이 정확하고 체계적이어야 진짜 효과가 있다고 생각하는 사람이에요. 감정적 공감도 중요하지만, 실질적이고 정확한 지원이 더 중요하다고 느껴요. 의료, 복지, 행정 지원 분야에서 빛을 발하는 조합이에요. 신뢰할 수 있는 지원 전문가 유형이에요.",nature:"꼼꼼함과 사람에 대한 관심이 함께해요. 정확하고 체계적인 방식으로 사람의 삶을 지원하는 것에서 보람을 느껴요.",closing:"당신의 지원은 따뜻하면서 정확해요. 그 두 가지가 함께할 때 사람들이 가장 믿고 의지하게 되는 전문가가 돼요."},
"CE":{tagline:"꼼꼼한 계획으로 큰 목표를 이루는 사람",intro:"당신은 큰 그림을 그리는 추진력이 있으면서, 동시에 그것을 빈틈없이 실행하는 꼼꼼함도 있어요. 목표를 세우고 달려가되, 세부 사항을 놓치지 않는 사람이에요. 계획-실행-점검의 전 과정을 체계적으로 완수하는 능력이 탁월해요. 비전과 완성도를 동시에 갖춘 리더형 전문가예요.",nature:"추진력과 꼼꼼함이 균형을 이뤄요. 목표를 향해 강하게 나아가면서도 디테일을 놓치지 않는 능력이 있어요.",closing:"당신의 계획은 실행되고 완성돼요. 큰 그림과 디테일을 동시에 보는 사람이 가장 믿음직한 결과를 만들어요."},
};
const LOAD_MSGS=["40개의 답변을 분석하는 중...","Holland RIASEC 이론 적용 중...","Super·Lent 진로 이론으로 교차 검증 중...","당신만을 위한 이야기를 쓰는 중...","거의 다 됐어요..."];

function calcScores(answers){const h={R:0,I:0,A:0,S:0,E:0,C:0};const v={돈:0,안정:0,의미:0,자유:0,성장:0,인정:0};answers.forEach(a=>Object.entries(a).forEach(([k,val])=>{if(k in h)h[k]=(h[k]||0)+val;else if(k in v)v[k]=(v[k]||0)+val;}));return{holland:h,values:v};}
function topN(scores,n){return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k])=>k);}
function analyzeLocally(hollandScores,valueScores,isMiddle){const top=topN(hollandScores,3);const primary=top[0]||'S';const secondary=top[1];const comboKey=secondary?primary+secondary:primary;const careers=isMiddle?MIDDLE_CAREERS:HIGH_CAREERS;const comboProfile=COMBO_PROFILES[comboKey];const baseProfiles=isMiddle?MIDDLE_PROFILES:HIGH_PROFILES;const profile=comboProfile||baseProfiles[primary]||baseProfiles['S'];const primaryCareers=(careers[primary]||[]).slice(0,2);const secondaryCareers=secondary?(careers[secondary]||[]).slice(0,2):[];const combinedCareers=[...primaryCareers,...secondaryCareers];const topValues=Object.entries(valueScores).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>k).filter(k=>valueScores[k]>0);return{tagline:profile.tagline,intro:profile.intro,nature:profile.nature,careers:combinedCareers,reference:"참고: Holland(1997) RIASEC 직업흥미 모델 · Savickas(2005) 진로구성이론(CCT) · Lent & Brown(2002) 사회인지진로이론(SCCT) · Savickas & Porfeli(2012) 진로적응력 척도 · 한국고용정보원(2023) 한국직업전망",closing:profile.closing,topCodes:top,topValues,primary,comboKey,isMiddle};}

function Welcome({onStart}){const[grade,setGrade]=useState("");return(<div style={{minHeight:"100vh",background:"#09090B",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"28px 20px"}}><div style={{maxWidth:380,width:"100%",textAlign:"center"}}><div style={{fontSize:11,letterSpacing:"0.25em",color:"#14B8A6",marginBottom:16,fontWeight:600}}>진로 탐색 앱</div><h1 style={{fontSize:42,fontWeight:900,lineHeight:1.1,marginBottom:10,color:"white",letterSpacing:"-0.02em"}}>내일지도</h1><p style={{fontSize:11,color:"#14B8A6",marginBottom:4,fontWeight:700,letterSpacing:"0.2em"}}>CAREER COMPASS</p><p style={{fontSize:13,color:"#52525B",marginBottom:6,fontWeight:500}}>내일 · 내 일 · 지도</p><p style={{fontSize:14,color:"#A1A1AA",lineHeight:1.85,marginBottom:36}}>나만의 진로를 찾아가는 여정.<br/>40개의 질문이 당신의 방향을 찾아드려요.</p><p style={{fontSize:13,color:"#A1A1AA",marginBottom:16,fontWeight:500}}>해당하는 곳을 선택해주세요</p><div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12,marginBottom:32}}>{[{label:"중학생",color:"#14B8A6",bg:"rgba(20,184,166,0.15)",border:"#14B8A6"},{label:"고등학생",color:"#3B82F6",bg:"rgba(59,130,246,0.15)",border:"#3B82F6"}].map(({label,color,bg,border})=>(<button key={label} onClick={()=>setGrade(label)} style={{padding:"22px 8px",borderRadius:16,border:`2px solid ${grade===label?border:"#3F3F46"}`,background:grade===label?bg:"#1C1C1F",color:grade===label?color:"#D4D4D8",fontSize:17,fontWeight:grade===label?800:500,cursor:"pointer",width:"100%"}}>{label}</button>))}</div><button onClick={()=>grade&&onStart(grade)} style={{width:"100%",padding:15,borderRadius:14,background:grade?"#14B8A6":"#27272A",color:grade?"white":"#52525B",fontSize:15,fontWeight:700,border:"none",cursor:grade?"pointer":"default"}}>{grade?`${grade} 질문으로 시작하기 →`:"먼저 선택해주세요"}</button><p style={{fontSize:12,color:"#14B8A6",marginTop:14,fontWeight:600}}>✓ 완전 무료 · 광고 없음 · 저장 없음</p><p style={{fontSize:10,color:"#52525B",marginTop:8,lineHeight:1.6}}>Holland RIASEC · Savickas CCT · Lent &amp; Brown SCCT 이론 기반<br/>한국고용정보원 직업전망 데이터 반영</p><p style={{fontSize:11,color:"#3F3F46",marginTop:6}}>아이들의 진로 탐색을 응원하는 마음으로 만들었어요 🙂</p></div></div>);}

function StageIntro({stageIdx,onGo,isMiddle}){const info=(isMiddle?MIDDLE_STAGE_INFO:HIGH_STAGE_INFO)[stageIdx];const color=STAGE_COLORS[stageIdx];return(<div style={{minHeight:"100vh",background:"#09090B",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 24px",textAlign:"center"}}><div style={{fontSize:11,color,letterSpacing:"0.2em",marginBottom:20,fontWeight:600}}>STAGE {stageIdx+1} / 5</div><h2 style={{fontSize:26,fontWeight:800,color:"white",marginBottom:10}}>{info.title}</h2><p style={{color:"#71717A",fontSize:14,marginBottom:40}}>{info.sub}</p><button onClick={onGo} style={{padding:"14px 36px",borderRadius:14,background:color,color:"white",fontSize:14,fontWeight:700,border:"none",cursor:"pointer"}}>시작하기</button></div>);}

function Question({qi,onAnswer,isMiddle}){const[selected,setSelected]=useState([]);const[out,setOut]=useState(false);const QS=isMiddle?[...MIDDLE_QS,...MIDDLE_VALUES_QS]:[...HIGH_QS,...HIGH_VALUES_QS];const SI=isMiddle?MIDDLE_STAGE_INFO:HIGH_STAGE_INFO;const q=QS[qi];const pct=Math.round((qi/QS.length)*100);useEffect(()=>{setSelected([]);setOut(false);},[qi]);const toggle=(i)=>{if(selected.includes(i))setSelected(selected.filter(x=>x!==i));else if(selected.length<2)setSelected([...selected,i]);};const handleNext=()=>{if(!selected.length)return;setOut(true);setTimeout(()=>{const w=selected.length===2?0.5:1;const combined={};selected.forEach(i=>Object.entries(q.o[i].r).forEach(([k,v])=>{combined[k]=(combined[k]||0)+v*w;}));onAnswer(combined,selected.map(i=>q.o[i].t).join(" / "));},160);};return(<div style={{minHeight:"100vh",background:"#F9FAFB",display:"flex",flexDirection:"column"}}><div style={{background:"#09090B",padding:"14px 18px 0"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:11,color:"#71717A",fontWeight:500}}>{SI[q.s].title}</span><span style={{fontSize:11,color:"#52525B"}}>{qi+1} / {QS.length}</span></div><div style={{height:3,background:"#1F1F23",borderRadius:2,marginBottom:10}}><div style={{height:3,background:"#14B8A6",borderRadius:2,width:`${pct}%`,transition:"width 0.4s ease"}}/></div><div style={{display:"flex",gap:3,paddingBottom:14}}>{SI.map((_,i)=><div key={i} style={{flex:1,height:3,borderRadius:2,background:i<q.s?"#14B8A6":i===q.s?"rgba(20,184,166,0.4)":"#27272A"}}/>)}</div></div><div style={{flex:1,padding:"22px 18px 100px",maxWidth:420,margin:"0 auto",width:"100%",opacity:out?0:1,transition:"opacity 0.16s"}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><span style={{fontSize:11,color:"#9CA3AF",fontWeight:600}}>Q{qi-QS.findIndex(x=>x.s===q.s)+1}</span><span style={{fontSize:10,color:"#14B8A6",background:"rgba(20,184,166,0.1)",padding:"2px 8px",borderRadius:100,fontWeight:600}}>최대 2개 선택 가능</span></div><h2 style={{fontSize:17,fontWeight:800,color:"#111",lineHeight:1.55,marginBottom:18}}>{q.q}</h2><div style={{display:"flex",flexDirection:"column",gap:10}}>{q.o.map((opt,i)=>{const isSel=selected.includes(i);const dis=!isSel&&selected.length>=2;return(<button key={i} onClick={()=>!dis&&toggle(i)} style={{textAlign:"left",padding:"14px 16px",borderRadius:14,border:isSel?"2px solid #14B8A6":"1.5px solid #E5E7EB",background:isSel?"rgba(20,184,166,0.08)":"white",fontSize:14,color:dis?"#C4C4C4":"#111",lineHeight:1.55,cursor:dis?"default":"pointer",display:"flex",alignItems:"center",gap:12}}><div style={{width:20,height:20,borderRadius:6,flexShrink:0,border:isSel?"2px solid #14B8A6":"1.5px solid #D1D5DB",background:isSel?"#14B8A6":"white",display:"flex",alignItems:"center",justifyContent:"center"}}>{isSel&&<span style={{color:"white",fontSize:11,fontWeight:700}}>✓</span>}</div><span>{opt.t}</span></button>);})}</div></div><div style={{position:"sticky",bottom:0,padding:"12px 18px 20px",background:"linear-gradient(to top,#F9FAFB 60%,transparent)",maxWidth:420,margin:"0 auto",width:"100%"}}><button onClick={handleNext} disabled={!selected.length} style={{width:"100%",padding:15,borderRadius:14,background:selected.length?"#14B8A6":"#E5E7EB",color:selected.length?"white":"#9CA3AF",fontSize:15,fontWeight:700,border:"none",cursor:selected.length?"pointer":"default"}}>{!selected.length?"선택해주세요":qi===QS.length-1?"분석 시작하기 →":`다음 질문 → (${selected.length}개 선택됨)`}</button></div></div>);}

function Loading({msgIdx}){return(<div style={{minHeight:"100vh",background:"#09090B",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,textAlign:"center"}}><div style={{width:44,height:44,borderRadius:"50%",border:"3px solid #27272A",borderTopColor:"#14B8A6",animation:"spin 1s linear infinite",margin:"0 auto 28px"}}/><p style={{color:"#A1A1AA",fontSize:14,lineHeight:1.7}}>{LOAD_MSGS[msgIdx]}</p><style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style></div>);}

function Result({result,grade,onRetry}){const top=result.topCodes||[];const isMiddle=result.isMiddle;return(<div style={{minHeight:"100vh",background:"#F9FAFB"}}><div style={{background:"#09090B",padding:"26px 20px",textAlign:"center"}}><div style={{fontSize:10,color:"#14B8A6",letterSpacing:"0.2em",marginBottom:12,fontWeight:600}}>내일지도 — {isMiddle?"나의 진로 탐색":"나의 진로 이야기"}</div><h1 style={{color:"white",fontSize:19,fontWeight:800,lineHeight:1.4,marginBottom:16}}>{result.tagline}</h1><div style={{display:"flex",gap:7,justifyContent:"center",flexWrap:"wrap"}}>{result.comboKey&&<span style={{padding:"5px 16px",borderRadius:100,fontSize:13,fontWeight:800,background:"rgba(20,184,166,0.15)",color:"#14B8A6",border:"1.5px solid #14B8A6",marginBottom:6,display:"inline-block"}}>{result.comboKey} 유형</span>}{top.map(c=><span key={c} style={{padding:"4px 12px",borderRadius:100,fontSize:11,fontWeight:600,background:HOLLAND[c]?.bg,color:HOLLAND[c]?.color,border:`1px solid ${HOLLAND[c]?.color}33`}}>{HOLLAND[c]?.ko||c}</span>)}</div></div><div style={{padding:"18px 18px",maxWidth:440,margin:"0 auto"}}>{[{label:isMiddle?"너에 대해":"당신에 대해",text:result.intro},{label:isMiddle?"너의 강점":"당신의 본질",text:result.nature}].map(({label,text})=>(<div key={label} style={{background:"white",borderRadius:18,padding:20,marginBottom:14,border:"1px solid #E5E7EB"}}><div style={{fontSize:10,color:"#9CA3AF",fontWeight:700,marginBottom:10,letterSpacing:"0.08em"}}>{label}</div><p style={{fontSize:14,lineHeight:1.85,color:"#374151",margin:0}}>{text}</p></div>))}<div style={{fontSize:11,color:"#6B7280",marginBottom:12,fontWeight:600}}>{isMiddle?"탐색 분야 4가지":result.comboKey&&result.comboKey.length===2?result.comboKey[0]+"형 + "+result.comboKey[1]+"형 맞춤 직업 4가지":"추천 진로 4가지"}</div>{(result.careers||[]).map((c,i)=>(<div key={i} style={{background:"white",borderRadius:18,padding:20,marginBottom:14,border:"1px solid #E5E7EB"}}><div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}><span style={{fontSize:26}}>{c.emoji}</span><div><div style={{fontSize:16,fontWeight:800,color:"#111"}}>{c.title}</div><div style={{fontSize:12,color:"#14B8A6",marginTop:2,lineHeight:1.4}}>{c.hook}</div></div></div><div style={{background:"#F9FAFB",borderRadius:12,padding:14,marginBottom:12}}><div style={{fontSize:10,color:"#9CA3AF",fontWeight:700,marginBottom:6,letterSpacing:"0.08em"}}>{isMiddle?"어떤 분야야?":"어떤 하루를 보낼까"}</div><p style={{fontSize:13,lineHeight:1.75,color:"#374151",margin:0}}>{c.day}</p></div><div style={{marginBottom:i<2?12:0}}><div style={{fontSize:10,color:"#9CA3AF",fontWeight:700,marginBottom:6,letterSpacing:"0.08em"}}>{isMiddle?"왜 나한테 맞을까?":"왜 나에게 맞을까"}</div><p style={{fontSize:13,lineHeight:1.75,color:"#374151",margin:0}}>{c.why}</p></div><div><div style={{fontSize:10,color:"#9CA3AF",fontWeight:700,marginBottom:8,letterSpacing:"0.08em"}}>{isMiddle?"지금 해볼 수 있는 것":"첫 걸음"}</div>{c.path.map((p,pi)=>(<div key={pi} style={{display:"flex",gap:8,marginBottom:5}}><span style={{color:"#14B8A6",fontWeight:800,flexShrink:0,fontSize:13}}>{pi+1}.</span><span style={{fontSize:12,color:"#6B7280",lineHeight:1.55}}>{p}</span></div>))}{c.jobs&&c.jobs.length>0&&(<div style={{marginTop:12,padding:"10px 12px",background:"rgba(20,184,166,0.06)",borderRadius:10,border:"1px solid rgba(20,184,166,0.2)"}}><div style={{fontSize:10,color:"#0F766E",fontWeight:700,marginBottom:6}}>💼 관련 직업 예시</div><div style={{display:"flex",flexWrap:"wrap",gap:5}}>{c.jobs.map(j=>(<span key={j} style={{fontSize:11,padding:"3px 10px",borderRadius:100,background:"rgba(20,184,166,0.1)",color:"#0F766E",fontWeight:600}}>{j}</span>))}</div></div>)}{c.majors&&c.majors.length>0&&(<div style={{marginTop:8,padding:"10px 12px",background:"rgba(59,130,246,0.06)",borderRadius:10,border:"1px solid rgba(59,130,246,0.15)"}}><div style={{fontSize:10,color:"#3B82F6",fontWeight:700,marginBottom:6}}>🎓 관련 학과</div><div style={{display:"flex",flexWrap:"wrap",gap:5}}>{c.majors.map(m=>(<span key={m} style={{fontSize:11,padding:"3px 10px",borderRadius:100,background:"rgba(59,130,246,0.1)",color:"#2563EB",fontWeight:600}}>{m}</span>))}</div></div>)}</div></div>))}<div style={{background:"white",borderRadius:18,padding:20,marginBottom:14,border:"1px solid #E5E7EB"}}>
          <div style={{fontSize:10,color:"#9CA3AF",fontWeight:700,marginBottom:12,letterSpacing:"0.08em"}}>나의 직업 가치관</div>
          {result.topValues&&result.topValues.length>0?(<div>
            <p style={{fontSize:13,color:"#374151",marginBottom:12,lineHeight:1.7}}>검사 결과, {isMiddle?"너":"당신"}이 일에서 가장 중요하게 생각하는 가치예요.</p>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>{result.topValues.map((v,i)=>VALUE_TYPES[v]&&(<div key={v} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:12,background:i===0?"rgba(20,184,166,0.06)":"#F9FAFB",border:`1.5px solid ${i===0?"#14B8A6":"#E5E7EB"}`}}>
              <div style={{fontSize:22,flexShrink:0}}>{VALUE_TYPES[v].ko.split(" ")[0]}</div>
              <div><div style={{fontSize:13,fontWeight:700,color:"#111",marginBottom:2}}>{VALUE_TYPES[v].ko.split(" ").slice(1).join(" ")}{i===0?" ✦":""}</div><div style={{fontSize:12,color:"#6B7280"}}>{VALUE_TYPES[v].desc}</div></div>
            </div>))}</div>
          </div>):<p style={{fontSize:13,color:"#9CA3AF",margin:0}}>가치관 데이터가 없어요.</p>}
        </div>
        <div style={{background:"#F0FDF4",borderRadius:14,padding:"14px 16px",marginBottom:14,border:"1px solid #BBF7D0"}}><div style={{fontSize:10,color:"#059669",fontWeight:700,marginBottom:5}}>📚 참고 이론</div><p style={{fontSize:11.5,color:"#065F46",lineHeight:1.65,margin:0}}>{result.reference}</p></div><div style={{background:"#09090B",borderRadius:18,padding:22,marginBottom:14,textAlign:"center"}}><p style={{fontSize:14,lineHeight:1.85,color:"#D4D4D8",margin:0}}>{result.closing}</p></div><div style={{background:"white",borderRadius:18,padding:20,marginBottom:14,border:"1px solid #E5E7EB",textAlign:"center"}}><div style={{fontSize:18,marginBottom:8}}>🙌</div><div style={{fontSize:14,fontWeight:700,color:"#111",marginBottom:6}}>친구에게 공유해보세요</div><p style={{fontSize:12,color:"#6B7280",lineHeight:1.65,marginBottom:14}}>이 앱은 완전 무료예요. 진로를 고민하는 친구에게 링크를 나눠주세요.</p><button onClick={()=>{if(navigator.share){navigator.share({title:'내일지도',text:'40개 질문으로 알아보는 나만의 진로 성향',url:window.location.href});}else{navigator.clipboard?.writeText(window.location.href).then(()=>alert('링크가 복사됐어요! 친구에게 보내주세요 😊'));}}} style={{padding:"12px 28px",borderRadius:12,background:"#14B8A6",color:"white",fontSize:14,fontWeight:700,border:"none",cursor:"pointer"}}>친구에게 공유하기 →</button></div><div style={{background:"#FFF7ED",borderRadius:18,padding:20,marginBottom:14,border:"1px solid #FED7AA"}}>
          <div style={{fontSize:13,fontWeight:700,color:"#92400E",marginBottom:8}}>👨‍👩‍👧 부모님께 드리는 카드</div>
          {result.primary&&PARENT_GUIDE[result.primary]&&(<div>
            <p style={{fontSize:13,color:"#78350F",lineHeight:1.7,marginBottom:12}}>{PARENT_GUIDE[result.primary].summary}</p>
            <div style={{fontSize:11,color:"#92400E",fontWeight:700,marginBottom:8}}>이렇게 지원해주세요</div>
            {PARENT_GUIDE[result.primary].tips.map((tip,i)=>(<div key={i} style={{display:"flex",gap:8,marginBottom:6}}><span style={{color:"#F59E0B",fontWeight:800,flexShrink:0,fontSize:13}}>{i+1}.</span><span style={{fontSize:12,color:"#78350F",lineHeight:1.55}}>{tip}</span></div>))}
            {result.topValues&&result.topValues[0]&&VALUE_PARENT[result.topValues[0]]&&(<div style={{marginTop:12,background:"rgba(245,158,11,0.1)",borderRadius:10,padding:"10px 12px"}}><div style={{fontSize:11,color:"#92400E",fontWeight:700,marginBottom:4}}>💡 이 아이의 동기 버튼</div><p style={{fontSize:12,color:"#78350F",lineHeight:1.6,margin:0}}>{VALUE_PARENT[result.topValues[0]]}</p></div>)}
          </div>)}
        </div>
        <div style={{background:"#F0FDF4",borderRadius:18,padding:20,marginBottom:14,border:"1px solid #BBF7D0"}}><div style={{fontSize:13,fontWeight:700,color:"#065F46",marginBottom:6}}>🏫 선생님이신가요?</div><p style={{fontSize:12,color:"#047857",lineHeight:1.65,marginBottom:12}}>학급 전체 진로 검사 + 학생별 결과 대시보드 준비 중이에요.</p><button onClick={()=>alert('선생님 플랜 오픈 준비 중이에요! 😊')} style={{padding:"10px 20px",borderRadius:12,background:"#059669",color:"white",fontSize:13,fontWeight:700,border:"none",cursor:"pointer"}}>선생님 플랜 알림 받기</button></div><button onClick={onRetry} style={{width:"100%",padding:13,borderRadius:14,background:"transparent",border:"1.5px solid #E5E7EB",color:"#6B7280",fontSize:13,cursor:"pointer",marginBottom:20}}>↩ 처음으로 돌아가기</button><div style={{textAlign:"center",color:"#9CA3AF",fontSize:11,paddingBottom:24}}>© 2026 정태환 · 내일지도 (CAREER COMPASS) · 무단복제 금지</div></div></div>);}

function App(){const[screen,setScreen]=useState("welcome");const[grade,setGrade]=useState("");const[isMiddle,setIsMiddle]=useState(false);const[qi,setQi]=useState(0);const[answers,setAnswers]=useState([]);const[stageIntro,setStageIntro]=useState(true);const[result,setResult]=useState(null);const[msgIdx,setMsgIdx]=useState(0);useEffect(()=>{if(screen!=="loading")return;const t=setInterval(()=>setMsgIdx(p=>(p+1)%LOAD_MSGS.length),700);return()=>clearInterval(t);},[screen]);const QS=isMiddle?[...MIDDLE_QS,...MIDDLE_VALUES_QS]:[...HIGH_QS,...HIGH_VALUES_QS];const handleStart=(g)=>{const mid=g.startsWith('중');setGrade(g);setIsMiddle(mid);setQi(0);setAnswers([]);setStageIntro(true);setResult(null);setScreen("questions");};const handleAnswer=(scores,text)=>{const newAns=[...answers,{scores,text}];setAnswers(newAns);if(qi<QS.length-1){const prevS=QS[qi].s;const nqi=qi+1;setQi(nqi);if(QS[nqi].s!==prevS)setStageIntro(true);}else{setScreen("loading");setMsgIdx(0);setTimeout(()=>{const{holland,values}=calcScores(newAns.map(a=>a.scores));setResult(analyzeLocally(holland,values,isMiddle));setScreen("result");},3500);}};if(screen==="welcome")return <Welcome onStart={handleStart}/>;if(screen==="questions"){if(stageIntro)return <StageIntro stageIdx={QS[qi].s} onGo={()=>setStageIntro(false)} isMiddle={isMiddle}/>;return <Question qi={qi} onAnswer={handleAnswer} isMiddle={isMiddle}/>;}if(screen==="loading")return <Loading msgIdx={msgIdx}/>;if(screen==="result")return <Result result={result} grade={grade} onRetry={()=>{setScreen("welcome");setQi(0);setAnswers([]);setResult(null);}}/>;return null;}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
