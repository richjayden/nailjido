<script type="text/babel">
const {useState,useEffect} = React;

const DEEP_CARD1={
  "RI":"당신은 손으로 만지면서 동시에 '왜 이렇게 되는 거지?'를 묻는 사람이에요. 대부분의 사람은 둘 중 하나예요 — 만드는 사람이거나, 연구하는 사람이거나. 당신은 드물게 둘 다예요. 이해하지 못한 채로 넘어가는 게 꽤 불편할 거예요. 대충 아는 척하는 게 오히려 더 힘들죠. 그 꼼꼼함이 때로는 답답해 보일 수 있지만, 당신이 한 번 제대로 이해한 건 절대 흔들리지 않아요. 기술자의 손과 과학자의 두뇌가 동시에 있는 사람 — 세상이 가장 필요로 하는 조합이에요.",
  "RA":"당신은 뭔가를 만들 때 '잘 작동하는가'와 '아름다운가'를 동시에 신경 써요. 기능만 좋으면 뭔가 부족하고, 예쁘기만 해도 만족이 안 되는 사람이에요. 완성도에 대한 기준이 너무 높아서 '이 정도면 됐는데' 싶어도 손이 계속 가게 될 거예요. 그게 완벽주의처럼 보이지만, 사실은 진짜 좋은 걸 알아보는 눈이 있기 때문이에요. 기능과 아름다움을 동시에 추구하는 사람이 가장 오래 기억되는 것들을 만들어왔어요.",
  "RS":"당신은 사람을 돕는 방식이 남달라요. 말이나 공감으로만 끝내는 게 아니라, 직접 뭔가를 해주고 만들어주고 해결해줘요. '그냥 들어주면 되는데 왜 해결책부터 찾냐'는 말 들어본 적 있나요? 그게 당신이 틀린 게 아니에요 — 행동으로 마음을 표현하는 사람이거든요. 때로는 혼자 너무 많이 해주려다 지칠 수 있어요. 하지만 따뜻한 마음과 실용적인 손이 동시에 있는 사람의 도움이 가장 오래 기억돼요.",
  "RE":"당신은 지시만 하는 사람이 아니에요. 가장 먼저 현장에 나가서 직접 보여주는 사람이에요. '이렇게 하면 돼'라고 말하는 대신 직접 해서 증명하죠. 혼자 너무 많이 하려다 지치는 순간도 있을 거예요. '다른 사람에게 맡겼다가 잘못되면 어떡하지'라는 생각에 결국 내가 하게 되는 패턴 있죠? 그 책임감이 당신을 팀에서 가장 믿음직한 사람으로 만들어요. 행동으로 증명하는 리더십이 가장 오래가는 신뢰를 만들어요.",
  "RC":"당신은 뭔가를 만들 때 '대충'이란 단어가 없는 사람이에요. 사소한 오차도 눈에 걸리고, 완성되지 않은 상태로 두는 게 불편할 거예요. 주변에서는 완벽주의처럼 보이지만, 사실 당신이 자신의 이름을 건 결과물에 진심인 거예요. 때로는 그 기준이 스스로를 힘들게 하기도 해요. 하지만 당신이 한 번 마무리한 것은 다른 사람들이 오래 믿고 의지하게 돼요. 정밀함이 신뢰가 되는 사람이에요.",
  "IR":"당신은 머릿속에서 이해한 걸 직접 손으로 확인하고 싶어하는 사람이에요. 이론이 맞다고 해도 '진짜로 해보면 어떨까?'라는 생각이 드는 유형이에요. 때로는 '저 사람 뭘 하고 싶은 건지 모르겠다'는 말을 들을 수 있어요. 하지만 그건 당신이 단순한 한 가지 틀에 갇히지 않는 사람이기 때문이에요. 지식을 현장에서 검증하는 사람이 가장 실용적인 지혜를 갖게 되더라고요.",
  "IA":"당신은 깊이 탐구하는 것을 좋아하면서, 그 결과를 남다른 방식으로 표현하는 사람이에요. 복잡한 개념을 보면 '이걸 어떻게 다르게 표현할 수 있을까?'라는 생각이 자연스럽게 드는 편일 거예요. 어떤 분야를 공부하든 남들과는 다른 시각으로 접근해서 '저 사람 왜 저런 생각을 하지?'라는 눈길을 받을 수 있어요. 그건 당신이 틀린 게 아니라 더 많은 걸 보고 있는 거예요. 지식의 깊이와 표현의 독창성이 만날 때 가장 오래 기억되는 것들이 탄생해요.",
  "IS":"당신은 지식을 쌓는 목적이 결국 사람을 위해서예요. '왜 그런지' 끊임없이 탐구하는 것도, 데이터를 분석하는 것도 결국 누군가의 삶이 더 나아지길 바라는 마음에서 출발해요. 차가워 보이는 분석 뒤에 따뜻한 마음이 있는 사람이에요. 가끔은 '더 알아보고 나서 해야지'가 반복될 수 있죠. 하지만 당신의 행동은 항상 근거가 있어요. 지식이 따뜻함과 만날 때 가장 신뢰받는 전문가가 돼요.",
  "IE":"당신은 충분히 분석하고 난 다음에 강하게 실행하는 사람이에요. '그냥 빨리 해'라는 말이 답답하게 느껴질 거예요. 그 신중함 때문에 기회를 놓친 것 같은 느낌이 들 수도 있어요. 하지만 당신이 한 번 결정하면 흔들리지 않아요. 논리적 근거 위에서 과감하게 행동하기 때문에 당신의 결정은 설득력이 강해요. 분석하고 행동하는 사람이 가장 지속가능한 결과를 만들어요.",
  "IC":"당신은 탐구한 결과를 절대 대충 정리하지 않는 사람이에요. 깊이 파고드는 것만큼 그 내용을 빈틈없이 체계화하는 것에서도 만족을 느끼죠. '왜 이렇게 꼼꼼하게 검증하냐'는 말 들어본 적 있나요? 당신에게는 불완전한 정보를 그냥 넘기는 게 더 불편한 거예요. 그 집요한 검증이 당신이 다루는 정보를 가장 신뢰할 수 있는 것으로 만들어요.",
  "AR":"당신은 머릿속에 있는 것을 직접 손으로 꺼내야 직성이 풀리는 사람이에요. 상상으로 끝나지 않고, 실제로 만들어내야 완성된 느낌이 드는 유형이에요. 때로는 머릿속 상상과 결과물 사이의 차이가 답답할 수 있어요. '생각한 것보다 못 나온 것 같은' 느낌 있죠? 하지만 그 차이를 메우려는 과정에서 당신은 계속 성장하고 있어요. 구상에서 완성까지 혼자 해낼 수 있는 사람이 가장 강한 창작자예요.",
  "AI":"당신은 깊이 느끼면서 동시에 깊이 생각하는 사람이에요. '예술 하는 사람치고 분석적이다', '분석적인 사람치고 감성적이다' 같은 말 들어본 적 있나요? 그건 당신이 두 세계를 동시에 보는 사람이기 때문이에요. 어떤 집단에서도 완전히 어느 한 쪽에 속하는 느낌이 안 들 수 있어요. 그게 외롭게 느껴질 수 있지만, 그 두 가지를 동시에 가진 사람이 가장 독창적인 것들을 만들어내요.",
  "AS":"당신은 창의적 표현이 결국 사람을 향해 있는 사람이에요. 아름다운 것을 만드는 목적이 누군가의 마음에 닿기 위해서죠. 다른 사람의 감정을 너무 잘 느껴서 스스로 지칠 수 있어요. 남의 이야기를 들으면 그냥 지나치지 못하는 편이죠? 그 감수성이 당신을 상처받게 만들기도 하지만, 동시에 다른 사람이 절대 만들지 못할 것들을 만들어내는 힘이 되기도 해요. 예술과 따뜻함이 만날 때 가장 깊이 사람의 마음을 움직여요.",
  "AE":"당신은 남다른 아이디어로 방향을 제시하고, 사람들이 따르게 만드는 사람이에요. '저 사람 또 이상한 생각 한다'는 말 들어본 적 있나요? 다른 사람들이 아직 보지 못한 걸 먼저 보는 거예요. 때로는 혼자 너무 앞서가서 주변이 못 따라온다는 느낌을 받을 수 있어요. 그 간극을 메우는 설득력까지 갖추면 가장 강한 크리에이티브 리더가 돼요.",
  "AC":"당신은 창의적인 아이디어를 가지면서 동시에 그 결과물이 완벽하게 마무리돼야 마음이 놓이는 사람이에요. 작업할 때 '이 정도면 됐지' 싶은 순간이 거의 없을 거예요. 그 집요함이 스스로를 힘들게 할 수 있지만, 당신이 만든 것은 시간이 지나도 퇴색하지 않아요. 아름답고 정확한 두 가지 기준을 동시에 충족하는 결과물은 가장 오래 남는 것들이에요.",
  "SR":"당신은 사람을 돕는 방식이 따뜻하면서도 실용적이에요. 공감만 하고 끝나는 게 아니라, 직접 뭔가를 해줘야 마음이 편한 사람이에요. '그냥 들어주면 되는데 왜 해결책부터 찾냐'는 말 들어본 적 있나요? 그게 당신이 틀린 게 아니에요 — 행동으로 마음을 표현하는 방식이거든요. 말보다 결과로 보여주는 따뜻함이 주변 사람들에게 가장 믿음직한 존재를 만들어요.",
  "SI":"당신은 사람에 관심이 많고, 그 관심이 단순한 공감에서 그치지 않아요. '왜 이 사람은 이런 행동을 할까?', '이 문제의 근본 원인은 뭘까?'를 탐구하는 방식으로 접근해요. 따뜻하면서도 분석적인 드문 유형이에요. '왜 그렇게 복잡하게 생각해?'라는 말을 들을 수 있어요. 사람을 직관적으로 느끼는 것에 그치지 않고, 제대로 이해하고 싶어서 그런 거예요. 사람을 마음으로 느끼고 머리로 이해하는 사람이 가장 깊은 곳에서 도울 수 있어요.",
  "SA":"당신은 사람을 돕는 방식이 감각적이고 창의적이에요. 위로를 전할 때 일반적인 방식 대신 자기만의 방법을 쓰죠. 때로는 다른 사람의 감정을 너무 잘 느껴서 스스로 지치기도 해요. 그 감수성이 당신을 상처받게 만들기도 하지만, 동시에 평범하지 않은 따뜻함으로 사람들의 마음에 더 깊이 닿게 해요. 공감과 창의가 만날 때 가장 특별한 위로가 탄생해요.",
  "SE":"당신은 사람에 대한 진심 어린 관심과, 그 사람들을 더 나은 곳으로 이끌고 싶은 추진력이 함께 있어요. 공감 능력이 뛰어나면서도 행동력이 있는 드문 조합이에요. 너무 많은 사람을 신경 쓰다가 정작 자신이 지치는 순간이 있을 거예요. '내가 없으면 어떻게 되나'라는 책임감이 쉬지 못하게 할 수 있죠. 그 따뜻한 책임감이 사람들이 믿고 따르는 리더를 만들어요.",
  "SC":"당신은 사람을 돕는 데 있어서 체계와 정확함을 중요하게 생각하는 사람이에요. 따뜻한 마음으로 다가가지만, 실제 지원이 빈틈없이 이뤄져야 진짜 도움이 된다고 느끼죠. '왜 이렇게 꼼꼼하게 따지냐'는 말 들어본 적 있나요? 당신에게는 대충 도와주는 게 더 불편한 거예요. 따뜻하면서도 정확한 지원을 하는 사람이 사람들이 가장 오래, 가장 깊이 의지하게 되는 존재가 돼요.",
  "ER":"당신은 말로만 지시하는 리더가 아니에요. 가장 먼저 현장에 나가서 직접 보여주는 사람이에요. 혼자 다 하려다가 지치는 순간도 분명 있을 거예요. '다른 사람에게 맡겼다가 잘못되면 어떡하지'라는 생각에 결국 내가 하게 되는 패턴 있죠? 그 책임감이 당신을 팀에서 가장 믿음직한 사람으로 만들어요. 행동으로 증명하는 리더십이 가장 오래가는 신뢰를 만들어요.",
  "EI":"당신은 충분히 분석하고 난 다음에 강하게 실행하는 사람이에요. 무모하게 달려가는 게 아니라, 논리적 근거 위에서 과감하게 행동하는 유형이에요. '그냥 빨리 결정해'라는 압박이 답답하게 느껴질 수 있어요. 그 신중함 때문에 기회를 놓친 것 같은 느낌이 들 수도 있어요. 하지만 당신이 한 번 결정하면 흔들리지 않아요. 분석하고 행동하는 사람이 가장 지속가능한 결과를 만들어요.",
  "EA":"당신은 새로운 아이디어로 방향을 제시하고 사람들이 따라오게 만드는 사람이에요. '저 사람 또 이상한 생각 한다'는 말 들어본 적 있나요? 다른 사람들이 아직 보지 못한 걸 먼저 보는 거예요. 혼자 너무 앞서가서 주변이 못 따라온다는 느낌, 비전이 너무 선명해서 설명하는 게 답답할 때가 있을 거예요. 당신의 상상은 세상을 바꾸는 에너지로 변환될 수 있어요.",
  "ES":"당신은 사람에 대한 진심 어린 관심과 강한 추진력이 함께 있어요. 공감 능력이 뛰어나면서도 행동력이 있는 드문 조합이에요. 너무 많은 사람을 신경 쓰다가 정작 자신이 지치는 순간이 있을 거예요. 그 따뜻한 책임감이 사람들이 믿고 따르는 리더를 만들어요. 공감하는 리더가 가장 오래가는 변화를 만들고, 당신이 바로 그런 사람이에요.",
  "EC":"당신은 큰 그림을 그리면서도 디테일을 놓치지 않는 사람이에요. '왜 이렇게 꼼꼼하게 계획하냐'와 '왜 이렇게 큰 목표를 세우냐'는 말을 동시에 들어본 적 있나요? 그게 당신이 두 가지를 동시에 가진 사람이기 때문이에요. 완성도와 추진력이 함께 있는 사람이 가장 믿음직한 결과를 만들어요.",

"AI":{tagline:"감성과 지성이 만나는 사람",intro:"당신은 깊이 느끼면서 동시에 깊이 생각하는 사람이에요. 감각적인 것에 끌리지만 '왜 이게 아름다운가?'를 분석하고 싶어하죠. 창의적인 동시에 논리적이고, 표현하고 싶으면서 동시에 이해하고 싶은 두 가지 욕구가 공존해요. 아마 어떤 분야를 하든 남들보다 더 깊게, 더 독창적으로 접근하는 편일 거예요.",nature:"창의적 직관과 분석적 사고가 함께 작동해요. 감각으로 포착하고 논리로 정교하게 만드는 과정이 당신만의 방식이에요.",closing:"느끼는 것과 이해하는 것이 당신 안에서 하나로 연결돼요. 그 드문 조합이 가장 깊이 있는 창작물을 만들어내요."},
"AS":{tagline:"표현으로 사람의 마음을 치유하는 사람",intro:"당신은 창의적 표현이 결국 사람을 향해 있는 사람이에요. 아름다운 것을 만드는 목적이 누군가의 마음에 닿기 위해서죠. 공감 능력이 뛰어나고, 그 감정을 예술적으로 표현하는 능력이 있어요. 상담사의 따뜻함과 예술가의 감성이 함께 있는 조합이에요. 감동을 주는 것과 사람을 돕는 것이 당신에게는 같은 일이에요.",nature:"공감 능력과 창의적 표현이 시너지를 내요. 사람의 감정을 읽고 그것을 아름다운 방식으로 돌려주는 능력이 탁월해요.",closing:"당신이 만드는 것들은 누군가에게 위로이고 힘이에요. 예술과 따뜻함이 만날 때 가장 깊이 사람의 마음을 움직이니까요."},
"AE":{tagline:"창의적 아이디어로 사람들을 이끄는 사람",intro:"당신은 남다른 아이디어로 방향을 제시하고, 사람들이 그 비전을 따르게 만드는 사람이에요. 창의성이 혼자만의 것이 아니라 다른 사람들을 이끄는 힘이 되는 타입이에요. 새로운 것에 끌리고, 그것을 현실로 만들기 위해 사람들을 설득하고 움직이는 것이 자연스러워요. 크리에이터이면서 리더인 조합이에요.",nature:"창의적 발상과 실행 추진력이 함께해요. 아이디어를 내는 것과 그것을 현실로 만드는 것, 둘 다 잘할 수 있어요.",closing:"당신의 창의성은 혼자서 소비되지 않아요. 사람들을 이끌고 세상을 바꾸는 에너지가 돼요."},
"AC":{tagline:"섬세한 감각과 완벽한 마감의 균형",intro:"당신은 창의적인 아이디어를 가지면서 동시에 그 결과물이 완벽하게 마무리되어야 마음이 놓이는 사람이에요. 대충 넘어가는 것이 불편하고, 디테일이 잘못되면 전체가 만족스럽지 않죠. 예술가의 감각과 완벽주의자의 꼼꼼함이 함께 있어요. 오래 두고 봐도 질리지 않는 완성도 높은 것들을 만들어내는 유형이에요.",nature:"창의성과 정밀함이 동시에 있어요. 아름다운 것을 구상하고, 빈틈없이 완성해내는 전 과정을 혼자 해낼 수 있어요.",closing:"당신이 만든 것은 아름다우면서도 완벽해요. 감각과 꼼꼼함이 만날 때 시간이 지나도 빛을 잃지 않는 결과물이 나와요."},
"SR":{tagline:"실질적인 방법으로 따뜻하게 돕는 사람",intro:"당신은 사람을 도울 때 말보다 행동이 앞서는 사람이에요. 공감하고 위로하는 것도 중요하지만, 실제로 뭔가를 해줄 때 진짜 보람을 느껴요. '어떻게 하면 실질적으로 도움이 될까?'를 먼저 생각하고, 그 답을 손으로 실행하죠. 따뜻한 마음과 실용적인 행동력이 함께 있어요.",nature:"공감 능력과 실행력이 함께 있어요. 말이 아닌 결과로 사람에게 기여하는 것에서 가장 큰 보람을 느껴요.",closing:"당신의 도움은 눈에 보이고 손에 잡혀요. 그 실용적인 따뜻함이 누군가에게는 가장 기억에 남는 도움이 될 거예요."},
"SI":{tagline:"사람을 과학적으로 이해하고 돕는 사람",intro:"당신은 사람에게 관심이 많고, 그 관심이 단순한 공감에서 그치지 않아요. '왜 이 사람은 이런 행동을 할까?', '이 문제의 근본 원인은 뭘까?'를 탐구하는 방식으로 접근해요. 심리학, 뇌과학, 사회과학 같은 분야에서 특히 빛나는 조합이에요. 따뜻하면서도 분석적인 드문 유형이에요.",nature:"공감 능력과 탐구심이 시너지를 내요. 사람을 느끼는 것에 그치지 않고 이해하고 연구하는 단계까지 나아가요.",closing:"당신은 사람을 마음으로 느끼고, 머리로 이해해요. 그 두 가지가 함께할 때 가장 깊이 있는 도움을 줄 수 있어요."},
"SA":{tagline:"공감과 창의로 사람의 마음을 여는 사람",intro:"당신은 사람을 돕는 방식이 감각적이고 창의적이에요. 따뜻한 마음을 표현하는 데 일반적인 방식 대신 자기만의 방법을 쓰죠. 글이나 그림, 음악 같은 창의적 수단으로 사람과 연결되고 위로를 전해요. 상담사의 공감력과 예술가의 감성이 함께 있는 독특한 조합이에요.",nature:"따뜻함과 창의적 표현이 함께 있어요. 사람의 감정을 읽고, 그에 맞는 창의적인 방식으로 위로하고 연결하는 능력이 있어요.",closing:"당신이 건네는 위로는 평범하지 않아요. 감각적이고 따뜻한 그 방식이 사람들의 마음에 더 오래 남아요."},
"SE":{tagline:"사람들을 이끌며 세상을 변화시키는 사람",intro:"당신은 사람을 좋아하고, 그 사람들이 더 나아지는 걸 돕고 싶어요. 그리고 그것을 더 크게, 더 많은 사람에게 하고 싶은 마음도 있어요. 한 사람을 돕는 것을 넘어서 시스템을 바꾸고, 더 많은 사람에게 닿고 싶은 욕구가 있죠. 따뜻한 마음과 강한 추진력이 함께 있는 사회 변화형 리더예요.",nature:"공감 능력과 리더십이 함께해요. 사람들의 마음을 움직이고 그 에너지를 방향으로 이끄는 자연스러운 리더십이 있어요.",closing:"당신의 따뜻함이 더 많은 사람에게 닿을수록 세상이 더 좋아져요. 공감하는 리더가 가장 오래가는 변화를 만들어요."},
"SC":{tagline:"체계적으로 사람의 삶을 지원하는 사람",intro:"당신은 사람을 돕는 데 있어서 체계와 정확함을 중요하게 생각하는 사람이에요. 따뜻한 마음으로 다가가지만, 실제 지원이 빈틈없이 이뤄져야 진짜 도움이 된다고 생각해요. 감정도 중요하고 시스템도 중요한, 균형 잡힌 돌봄형 인재예요. 의료, 복지, 행정 지원 분야에서 특히 빛을 발하는 유형이에요.",nature:"공감 능력과 체계적 사고가 균형을 이뤄요. 사람을 진심으로 돕고 싶으면서 그 도움이 정확하고 신뢰할 수 있어야 한다는 기준이 있어요.",closing:"당신의 지원은 따뜻하면서도 정확해요. 그 두 가지가 함께할 때 사람들이 가장 오래, 가장 깊이 의지하게 되는 존재가 돼요."},
"ER":{tagline:"직접 뛰면서 팀을 이끄는 현장 리더",intro:"당신은 말로만 지시하는 리더가 아니에요. 가장 먼저 현장에 나가서 직접 해보이는 방식으로 신뢰를 얻어요. 추진력과 실행력이 동시에 있어서 계획을 세우고 직접 실행하는 전 과정을 혼자 이끌 수 있어요. '할 수 있어'라고 말하는 대신 직접 보여주는 사람이에요.",nature:"리더십과 실행력이 함께해요. 팀을 이끌면서 동시에 가장 많이 실행하는 사람으로, 신뢰와 성과를 동시에 만들어내요.",closing:"당신이 앞장서는 것만으로도 팀이 움직여요. 행동으로 증명하는 리더십이 가장 오래가는 신뢰를 만들어요."},
"EI":{tagline:"데이터 기반으로 전략을 세우는 리더",intro:"당신은 충분히 분석하고 난 다음에 강하게 실행하는 사람이에요. 근거 없이 달려가는 게 아니라, 데이터와 논리로 방향을 먼저 확인하고 그다음에 추진력을 발휘하죠. 설득력 있는 근거를 가지고 사람들을 이끄는 방식이 당신의 스타일이에요. 전략가이면서 실행가인 조합이에요.",nature:"분석력과 추진력이 순서 있게 작동해요. 논리적 근거 위에서 과감하게 행동하기 때문에 당신의 결정은 설득력이 강해요.",closing:"근거를 가지고 달려가는 것이 당신의 방식이에요. 분석하고 행동하는 사람이 가장 효율적으로 세상을 바꿔왔어요."},
"EA":{tagline:"창의적 비전으로 사람들을 이끄는 리더",intro:"당신은 새로운 아이디어로 방향을 제시하고 사람들을 그 비전으로 이끄는 사람이에요. 창의성이 혼자만의 것이 아니라 다른 사람들을 움직이는 에너지가 되죠. 남들이 생각하지 못한 방향을 먼저 보고, 그것을 향해 팀을 이끄는 것이 자연스러워요. 크리에이티브 디렉터형 리더예요.",nature:"창의적 발상과 리더십이 함께해요. 아이디어를 내고 그것을 실현하기 위해 사람들을 설득하고 이끄는 전 과정을 잘해요.",closing:"당신의 창의성은 세상에 혼자 존재하지 않아요. 사람들을 이끌고 함께 실현해나가는 에너지로 세상을 바꿔요."},
"ES":{tagline:"사람들을 이끌며 세상을 변화시키는 리더",intro:"당신은 사람에 대한 진심 어린 관심과 그 사람들을 더 나은 곳으로 이끌고 싶은 강한 추진력이 함께 있어요. 사회, 교육, 정책 분야에서 특히 빛나는 조합이에요. 사람들의 마음을 얻는 공감 능력과, 그 에너지를 방향으로 바꾸는 리더십이 동시에 있어요. 공감하는 리더, 변화를 만드는 사람이에요.",nature:"공감 능력과 리더십이 시너지를 내요. 사람들의 마음을 움직이고, 그 에너지를 실제 변화로 연결하는 능력이 탁월해요.",closing:"사람을 진심으로 대하면서 이끄는 사람이 가장 오래가는 변화를 만들어요. 당신이 바로 그런 리더예요."},
"EC":{tagline:"꼼꼼한 계획으로 큰 목표를 달성하는 리더",intro:"당신은 큰 그림을 그리는 추진력과, 그것을 빈틈없이 실행하는 꼼꼼함이 동시에 있어요. 목표를 향해 달려가면서도 디테일을 놓치지 않는 사람이에요. 계획하고 실행하고 점검하는 전 과정을 체계적으로 이끌 수 있어요. 비전과 실행력에 완성도까지 갖춘 드문 유형이에요.",nature:"추진력과 꼼꼼함이 균형을 이뤄요. 목표를 향해 강하게 달려가면서도 세부 사항을 놓치지 않는 능력이 있어요.",closing:"당신이 세운 계획은 실행되고 완성돼요. 큰 그림과 디테일을 동시에 보는 사람이 가장 믿음직한 리더가 돼요."},
"CR":{tagline:"정밀하게 만들고 체계적으로 관리하는 사람",intro:"당신은 만드는 것과 관리하는 것이 동시에 가능한 사람이에요. 뭔가를 직접 다루는 것을 좋아하면서, 그 과정이 체계적이고 정확하게 이뤄져야 마음이 놓이죠. 현장에서 직접 일하면서도 정밀한 기록과 관리를 놓치지 않는 사람이에요. 기술 분야의 완벽주의자 유형이에요.",nature:"실용적 기술력과 꼼꼼한 체계 관리가 함께해요. 만드는 것과 정리하는 것, 둘 다 잘하는 자기완결형 전문가예요.",closing:"당신이 관리하는 것은 믿음직해요. 정밀하게 만들고 꼼꼼하게 유지하는 그 능력이 어디서든 없어서는 안 될 존재를 만들어요."},
"CI":{tagline:"데이터를 정확하게 분석하고 체계화하는 사람",intro:"당신은 복잡한 정보를 탐구하고, 그 결과를 빈틈없이 정리하는 것에서 보람을 찾는 사람이에요. 분석하는 것도 좋고, 그 분석 결과를 체계적으로 정리하는 것도 좋아요. 데이터를 다루는 분야에서 특히 강한 힘을 발휘하는 조합이에요. 탐구하고 검증하고 정리하는 전 과정이 자연스러운 사람이에요.",nature:"탐구심과 체계적 사고가 함께해요. 복잡한 데이터도 당신을 거치면 명확하고 신뢰할 수 있는 자료가 돼요.",closing:"당신이 분석하고 정리한 것들은 다른 사람들이 오래 의지하게 될 거예요. 탐구와 정확함이 만날 때 진짜 가치 있는 결과가 나와요."},
"CA":{tagline:"섬세한 감각과 완벽한 정확함의 균형",intro:"당신은 아름다운 것에 끌리면서 동시에 그것이 완벽하게 정확해야 만족하는 사람이에요. 창의적인 감각과 꼼꼼한 완성도를 동시에 추구하죠. 예술적 감성이 있으면서도 디테일에 예민한 사람이에요. 오래 두고 봐도 빈틈이 없는 완성도 높은 창작물을 만들어내는 유형이에요.",nature:"창의적 감각과 꼼꼼한 정확함이 균형을 이뤄요. 아름답고 정확한, 두 가지 기준을 동시에 충족하는 결과물을 만들어내요.",closing:"당신이 만든 것은 아름다우면서 빈틈이 없어요. 감각과 꼼꼼함이 만날 때 시간이 지나도 퇴색하지 않는 가치가 생겨요."},

function calcScores(answers){
  const h={R:0,I:0,A:0,S:0,E:0,C:0};
  const v={"돈":0,"안정":0,"의미":0,"자유":0,"성장":0,"인정":0};
  answers.forEach(a=>Object.entries(a).forEach(([k,val])=>{
    if(k in h)h[k]=(h[k]||0)+val;
    else if(k in v)v[k]=(v[k]||0)+val;
  }));
  return{holland:h,values:v};
}
function topN(sc,n){return Object.entries(sc).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k])=>k);}
function getTeaser(hollandSc){
  const top=topN(hollandSc,1)[0];
  if(!top||hollandSc[top]===0)return null;
  const msgs={R:"🔧 만드는 성향이 강하게 보여요!",I:"🔬 탐구하는 성향이 강하게 보여요!",A:"🎨 예술적 감각이 강하게 느껴져요!",S:"💬 사람 중심 성향이 강하게 보여요!",E:"🚀 이끄는 성향이 강하게 보여요!",C:"📋 체계적인 성향이 강하게 보여요!"};
  return msgs[top]||null;
}
function analyzeResult(hollandSc,valueSc,isMiddle,grade){
  const top=topN(hollandSc,3);
  const primary=top[0]||'S';
  const secondary=top[1];
  const comboKey=secondary?primary+secondary:primary;
  const careers=isMiddle?MIDDLE_CAREERS:HIGH_CAREERS;
  const primaryCareers=(careers[primary]||[]).slice(0,2);
  const secondaryCareers=secondary?(careers[secondary]||[]).slice(0,2):[];
  const combinedCareers=[...primaryCareers,...secondaryCareers];
  const topValues=Object.entries(valueSc).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>k).filter(k=>valueSc[k]>0);
  const tagline=COMBO_TAGLINES[comboKey]||(COMBO_TAGLINES[primary]||'');
  const deepText=DEEP_CARD1[comboKey]||(DEEP_CARD1[primary]||'');
  const isAdult=['대학생','이직 고민','직장인'].includes(grade||'');
  return{comboKey,primary,secondary,tagline,deepText,careers:combinedCareers,topValues,topCodes:top,isMiddle,isAdult,
    reference:"Holland(1997) RIASEC · Savickas(2005) CCT · Lent & Brown(2002) SCCT · Savickas & Porfeli(2012) · 한국고용정보원(2023)"};
}

// ── THIS OR THAT 질문 컴포넌트 ──────────────────────────────────
function Question({qi,QS,onAnswer}){
  const[chosen,setChosen]=useState(null);
  const[animating,setAnimating]=useState(false);
  const q=QS[qi];
  const total=QS.length;
  const pct=Math.round((qi/total)*100);
  const stageInfo=STAGE_INFO[q.s]||STAGE_INFO[0];

  useEffect(()=>{setChosen(null);setAnimating(false);},[qi]);

  const handlePick=(side)=>{
    if(animating)return;
    setChosen(side);
    setAnimating(true);
    setTimeout(()=>{
      if(side==='M'){
        const merged={};
        Object.entries(q.L.r).forEach(([k,v])=>{merged[k]=(merged[k]||0)+1;});
        Object.entries(q.R.r).forEach(([k,v])=>{merged[k]=(merged[k]||0)+1;});
        onAnswer(merged);
      } else {
        onAnswer(side==='L'?q.L.r:q.R.r);
      }
    },280);
  };

  const cardStyle=(side)=>({
    flex:1,minHeight:150,borderRadius:20,border:`2px solid ${chosen===side?"#14B8A6":"#2A2A2E"}`,
    background:chosen===side?"rgba(20,184,166,0.15)":(chosen==='M'?"#161618":"(chosen&&chosen!==side?'rgba(0,0,0,0.3)':'#1C1C1F')"),
    display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
    padding:"20px 14px",cursor:"pointer",transition:"all 0.2s ease",
    transform:chosen===side?"scale(0.97)":"scale(1)",
    opacity:chosen==='M'?0.5:(chosen&&chosen!==side?0.35:1),
  });

  const opt=side=>side==='L'?q.L:q.R;

  return(
    <div style={{minHeight:"100vh",background:"#09090B",display:"flex",flexDirection:"column"}}>
      {/* 상단 진행바 */}
      <div style={{padding:"16px 18px 0",background:"#09090B"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
          <span style={{fontSize:11,color:"#52525B",fontWeight:500}}>{stageInfo.title}</span>
          <span style={{fontSize:11,color:"#52525B"}}>{qi+1} / {total}</span>
        </div>
        <div style={{height:3,background:"#1F1F23",borderRadius:2}}>
          <div style={{height:3,background:"#14B8A6",borderRadius:2,width:`${pct}%`,transition:"width 0.4s ease"}}/>
        </div>
        <div style={{display:"flex",gap:3,marginTop:8,paddingBottom:12}}>
          {STAGE_INFO.map((_,i)=><div key={i} style={{flex:1,height:3,borderRadius:2,background:i<q.s?"#14B8A6":i===q.s?"rgba(20,184,166,0.4)":"#27272A"}}/>)}
        </div>
      </div>

      {/* 질문 */}
      <div style={{flex:1,display:"flex",flexDirection:"column",padding:"24px 20px",maxWidth:440,margin:"0 auto",width:"100%"}}>
        <h2 style={{fontSize:19,fontWeight:800,color:"white",textAlign:"center",lineHeight:1.5,marginBottom:32}}>{q.q}</h2>

        {/* THIS OR THAT 카드 */}
        <div style={{display:"flex",gap:10,marginBottom:16}}>
          {['L','R'].map(side=>(
            <div key={side} style={cardStyle(side)} onClick={()=>handlePick(side)}>
              {opt(side).e&&<span style={{fontSize:36,marginBottom:10,display:"block"}}>{opt(side).e}</span>}
              <span style={{fontSize:13,fontWeight:600,color:chosen===side?"#14B8A6":"#D4D4D8",textAlign:"center",lineHeight:1.5}}>{opt(side).t}</span>
            </div>
          ))}
        </div>
        {/* 비슷해요 버튼 */}
        <div onClick={()=>handlePick('M')} style={{width:"100%",padding:"13px 0",borderRadius:14,border:`1.5px solid ${chosen==='M'?"#14B8A6":"#2A2A2E"}`,background:chosen==='M'?"rgba(20,184,166,0.1)":"#111113",textAlign:"center",cursor:"pointer",marginBottom:8,transition:"all 0.2s"}}>
          <span style={{fontSize:14,fontWeight:600,color:chosen==='M'?"#14B8A6":"#52525B"}}>🤝 비슷해요 — 둘 다 끌리거나 애매해요</span>
        </div>
        <p style={{textAlign:"center",fontSize:11,color:"#3F3F46"}}>직관적으로 골라요 — 생각하지 말고 느끼는 대로!</p>
      </div>
    </div>
  );
}

                      <p style={{fontSize:11,color:"#71717A",margin:"2px 0 0"}}>{VALUE_TYPES[v].desc}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* 참고 이론 */}
          <div style={{background:"rgba(5,150,105,0.06)",border:"1px solid rgba(5,150,105,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:16}}>
            <p style={{fontSize:10,color:"#059669",fontWeight:700,marginBottom:4}}>📚 참고 이론</p>
            <p style={{fontSize:11,color:"#065F46",lineHeight:1.6,margin:0}}>{result.reference}</p>
          </div>

          {/* 공유 버튼 */}
          <button onClick={shareCard1} style={{width:"100%",padding:14,borderRadius:14,background:"#14B8A6",color:"white",fontSize:14,fontWeight:700,border:"none",cursor:"pointer",marginBottom:12}}>
            친구에게 공유하기 →
          </button>
          <button onClick={()=>setCard(2)} style={{width:"100%",padding:14,borderRadius:14,background:"transparent",border:"1px solid #2A2A2E",color:"#A1A1AA",fontSize:14,fontWeight:600,cursor:"pointer"}}>
            진로 가이드 보기 →
          </button>
        </div>
      )}

      {/* 카드 2 — 진로 가이드 */}
      {card===2&&(
        <div style={{padding:"20px 18px",maxWidth:440,margin:"0 auto",animation:"fadeIn 0.3s ease"}}>
          <p style={{fontSize:11,color:"#71717A",marginBottom:14,fontWeight:600}}>{isMiddle?"탐색 분야 4가지":result.isAdult?"커리어 방향 4가지":"추천 진로 4가지"}</p>

          {(result.careers||[]).map((c,i)=>(
            <div key={i} style={{background:"#111113",border:"1px solid #2A2A2E",borderRadius:20,padding:20,marginBottom:14}}>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
                <span style={{fontSize:28}}>{c.emoji}</span>
                <div>
                  <p style={{fontSize:15,fontWeight:800,color:"#E4E4E7",margin:0}}>{c.title}</p>
                  <p style={{fontSize:12,color:"#14B8A6",margin:"3px 0 0",lineHeight:1.4}}>{c.hook}</p>
                </div>
              </div>
              <div style={{background:"#0D0D0F",borderRadius:12,padding:14,marginBottom:12}}>
                <p style={{fontSize:10,color:"#71717A",fontWeight:700,marginBottom:6,letterSpacing:"0.08em"}}>{isMiddle?"어떤 분야야?":result.isAdult?"어떤 커리어인가요":"어떤 하루를 보낼까"}</p>
                <p style={{fontSize:13,lineHeight:1.75,color:"#A1A1AA",margin:0}}>{c.day}</p>
              </div>
              <div style={{marginBottom:12}}>
                <p style={{fontSize:10,color:"#71717A",fontWeight:700,marginBottom:6,letterSpacing:"0.08em"}}>{isMiddle?"왜 나한테 맞을까?":result.isAdult?"왜 나에게 맞는 방향인가요":"왜 나에게 맞을까"}</p>
                <p style={{fontSize:13,lineHeight:1.75,color:"#A1A1AA",margin:0}}>{c.why}</p>
              </div>
              <div style={{marginBottom:c.majors&&c.majors.length>0?12:0}}>
                <p style={{fontSize:10,color:"#71717A",fontWeight:700,marginBottom:8,letterSpacing:"0.08em"}}>{isMiddle?"지금 해볼 수 있는 것":result.isAdult?"커리어 전환 첫 걸음":"첫 걸음"}</p>
                {c.path&&c.path.map((p,pi)=>(
                  <div key={pi} style={{display:"flex",gap:8,marginBottom:5}}>
                    <span style={{color:"#14B8A6",fontWeight:800,flexShrink:0,fontSize:13}}>{pi+1}.</span>
                    <span style={{fontSize:12,color:"#71717A",lineHeight:1.55}}>{p}</span>
                  </div>
                ))}
              </div>
              {c.jobs&&c.jobs.length>0&&(
                <div style={{marginTop:10,padding:"10px 12px",background:"rgba(20,184,166,0.06)",borderRadius:10,border:"1px solid rgba(20,184,166,0.2)"}}>
                  <p style={{fontSize:10,color:"#0F766E",fontWeight:700,marginBottom:6}}>💼 관련 직업 예시</p>
                  <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                    {c.jobs.map(j=><span key={j} style={{fontSize:11,padding:"3px 10px",borderRadius:100,background:"rgba(20,184,166,0.1)",color:"#14B8A6",fontWeight:600}}>{j}</span>)}
                  </div>
                </div>
              )}
              {c.majors&&c.majors.length>0&&(
                <div style={{marginTop:8,padding:"10px 12px",background:"rgba(59,130,246,0.06)",borderRadius:10,border:"1px solid rgba(59,130,246,0.15)"}}>
                  <p style={{fontSize:10,color:"#3B82F6",fontWeight:700,marginBottom:6}}>🎓 관련 학과</p>
                  <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                    {c.majors.map(m=><span key={m} style={{fontSize:11,padding:"3px 10px",borderRadius:100,background:"rgba(59,130,246,0.1)",color:"#2563EB",fontWeight:600}}>{m}</span>)}
                  </div>
                </div>
              )}
            </div>
          ))}

          {/* 부모님 카드 */}
          {result.primary&&(
            <div style={{background:"rgba(245,158,11,0.06)",border:"1px solid rgba(245,158,11,0.2)",borderRadius:20,padding:20,marginBottom:14}}>
              {result.isAdult?(
                <>
                  <p style={{fontSize:13,fontWeight:700,color:"#D97706",marginBottom:8}}>🤝 함께 일하는 사람에게</p>
                  {COLLEAGUE_GUIDE[result.primary]&&(
                    <>
                      <p style={{fontSize:13,color:"#92400E",lineHeight:1.7,marginBottom:12}}>{COLLEAGUE_GUIDE[result.primary].summary}</p>
                      <p style={{fontSize:11,color:"#D97706",fontWeight:700,marginBottom:8}}>이렇게 함께하면 더 잘 맞아요</p>
                      {COLLEAGUE_GUIDE[result.primary].tips.map((tip,i)=>(
                        <div key={i} style={{display:"flex",gap:8,marginBottom:6}}>
                          <span style={{color:"#F59E0B",fontWeight:800,flexShrink:0,fontSize:13}}>{i+1}.</span>
                          <span style={{fontSize:12,color:"#92400E",lineHeight:1.55}}>{tip}</span>
                        </div>
                      ))}
                      {result.topValues&&result.topValues[0]&&VALUE_PARENT[result.topValues[0]]&&(
                        <div style={{marginTop:12,background:"rgba(245,158,11,0.1)",borderRadius:10,padding:"10px 12px"}}>
                          <p style={{fontSize:11,color:"#D97706",fontWeight:700,marginBottom:4}}>💡 이 사람의 동기 버튼</p>
                          <p style={{fontSize:12,color:"#92400E",lineHeight:1.6,margin:0}}>{VALUE_PARENT[result.topValues[0]]}</p>
                        </div>
                      )}
                    </>
                  )}
                </>
              ):(
                PARENT_GUIDE[result.primary]&&(
                  <>
                    <p style={{fontSize:13,fontWeight:700,color:"#D97706",marginBottom:8}}>👨‍👩‍👧 부모님께 드리는 카드</p>
                    <p style={{fontSize:13,color:"#92400E",lineHeight:1.7,marginBottom:12}}>{PARENT_GUIDE[result.primary].summary}</p>
                    <p style={{fontSize:11,color:"#D97706",fontWeight:700,marginBottom:8}}>이렇게 지원해주세요</p>
                    {PARENT_GUIDE[result.primary].tips.map((tip,i)=>(
                      <div key={i} style={{display:"flex",gap:8,marginBottom:6}}>
                        <span style={{color:"#F59E0B",fontWeight:800,flexShrink:0,fontSize:13}}>{i+1}.</span>
                        <span style={{fontSize:12,color:"#92400E",lineHeight:1.55}}>{tip}</span>
                      </div>
                    ))}
                    {result.topValues&&result.topValues[0]&&VALUE_PARENT[result.topValues[0]]&&(
                      <div style={{marginTop:12,background:"rgba(245,158,11,0.1)",borderRadius:10,padding:"10px 12px"}}>
                        <p style={{fontSize:11,color:"#D97706",fontWeight:700,marginBottom:4}}>💡 이 아이의 동기 버튼</p>
                        <p style={{fontSize:12,color:"#92400E",lineHeight:1.6,margin:0}}>{VALUE_PARENT[result.topValues[0]]}</p>
                      </div>
                    )}
                  </>
                )
              )}
            </div>
          )}

          {/* 공유 */}
          <div style={{background:"#111113",border:"1px solid #2A2A2E",borderRadius:20,padding:20,marginBottom:14,textAlign:"center"}}>
            <p style={{fontSize:18,marginBottom:8}}>🙌</p>
            <p style={{fontSize:14,fontWeight:700,color:"#E4E4E7",marginBottom:6}}>친구에게 공유해보세요</p>
            <p style={{fontSize:12,color:"#71717A",lineHeight:1.65,marginBottom:14}}>진로를 고민하는 친구에게 링크를 보내주세요.</p>
            <button onClick={shareCard1} style={{padding:"12px 28px",borderRadius:12,background:"#14B8A6",color:"white",fontSize:14,fontWeight:700,border:"none",cursor:"pointer"}}>공유하기 →</button>
          </div>

          <button onClick={onRetry} style={{width:"100%",padding:13,borderRadius:14,background:"transparent",border:"1px solid #2A2A2E",color:"#71717A",fontSize:13,cursor:"pointer",marginBottom:20}}>↩ 처음으로</button>
          <p style={{textAlign:"center",color:"#3F3F46",fontSize:11,paddingBottom:24}}>© 2026 정태환 · 내일지도 (CAREER COMPASS) · 무단복제 금지</p>
        </div>
      )}
    </div>
  );
}

// ── App ─────────────────────────────────────────────────────────
function App(){
  const[screen,setScreen]=useState('welcome');
  const[grade,setGrade]=useState('');
  const[isMiddle,setIsMiddle]=useState(false);
  const[qi,setQi]=useState(0);
  const[answers,setAnswers]=useState([]);
  const[stageIntro,setStageIntro]=useState(true);
  const[result,setResult]=useState(null);
  const[msgIdx,setMsgIdx]=useState(0);

  useEffect(()=>{
    if(screen!=='loading')return;
    const t=setInterval(()=>setMsgIdx(p=>p+1),700);
    return()=>clearInterval(t);
  },[screen]);

  const isAdult=['대학생','이직 고민','직장인'].includes(grade);
  const QS=isMiddle?[...MIDDLE_TT,...VAL_TT]:isAdult?[...ADULT_TT,...VAL_TT]:[...HIGH_TT,...VAL_TT];

  const handleStart=(g)=>{
    setGrade(g);setIsMiddle(g.startsWith('중'));
    setQi(0);setAnswers([]);setStageIntro(true);setResult(null);setScreen('questions');
  };

  const handleAnswer=(scores)=>{
    const newAns=[...answers,scores];
    setAnswers(newAns);
    if(qi<QS.length-1){
      const prevS=QS[qi].s;
      const nqi=qi+1;
      setQi(nqi);
      if(QS[nqi].s!==prevS)setStageIntro(true);
    }else{
      setScreen('loading');setMsgIdx(0);
      setTimeout(()=>{
        const allScores={R:0,I:0,A:0,S:0,E:0,C:0,"돈":0,"안정":0,"의미":0,"자유":0,"성장":0,"인정":0};
        newAns.forEach(a=>Object.entries(a).forEach(([k,v])=>{if(k in allScores)allScores[k]+=v;}));
        const h={R:allScores.R,I:allScores.I,A:allScores.A,S:allScores.S,E:allScores.E,C:allScores.C};
        const v={"돈":allScores.돈,"안정":allScores.안정,"의미":allScores.의미,"자유":allScores.자유,"성장":allScores.성장,"인정":allScores.인정};
        setResult(analyzeResult(h,v,isMiddle,grade));
        setScreen('result');
      },3500);
    }
  };

  const getCurrentTeaser=()=>{
    if(!answers.length)return null;
    const h={R:0,I:0,A:0,S:0,E:0,C:0};
    answers.forEach(a=>Object.entries(a).forEach(([k,v])=>{if(k in h)h[k]+=v;}));
    return getTeaser(h);
  };

  if(screen==='welcome')return <Welcome onStart={handleStart}/>;
  if(screen==='questions'){
    if(stageIntro){
      const stageIdx=QS[qi].s;
      const teaser=qi>0?getCurrentTeaser():null;
      return <StageIntro stageIdx={stageIdx} onGo={()=>setStageIntro(false)} teaser={teaser}/>;
    }
    return <Question qi={qi} QS={QS} onAnswer={handleAnswer}/>;
  }
  if(screen==='loading')return <Loading msgIdx={msgIdx}/>;
  if(screen==='result')return <Result result={result} grade={grade} onRetry={()=>{setScreen('welcome');setQi(0);setAnswers([]);setResult(null);}}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
